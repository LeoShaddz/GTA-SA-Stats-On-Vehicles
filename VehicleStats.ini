[VehicleStats]
; 1 = enabled, 0 = disabled
Enabled = 1

; Trigger to open the stats INSIDE the vehicle
UseKeyboard = 1
; TAB, CAPSLOCK, ENTER, SPACE, LSHIFT, LCTRL, LALT, F1..F12 or a letter
KeyboardKey = TAB
UsePad = 1
; L1, L2, R1, R2, UP, DOWN, LEFT, RIGHT, START, SELECT, SQUARE, TRIANGLE, CROSS, CIRCLE, L3, R3
PadButton = LEFT

; On foot, the screen opens using the game's original button.

[Layout]
; 0 = the screen stays in its original position (on foot and in the vehicle)
; 1 = the screen moves to the top, centered, ON FOOT AND IN THE VEHICLE
MoveToTop = 0
; Distance from the top when MoveToTop = 1 (640x448 screen units). Increase to move it down.
TopMargin = 30
; Extra horizontal offset when MoveToTop = 1 (640 units). Positive = right.
OffsetX = 0
; 1 = inside the vehicle, the "Stamina" row becomes the current vehicle's skill
;     (car: driving, motorcycle: riding, bicycle: cycling, airplane/helicopter: flying)
SkillRow = 1