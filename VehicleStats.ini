[VehicleStats]
; 1 = ativo, 0 = desativado
Enabled = 1

; Gatilho para abrir as estatisticas DENTRO do veiculo
UseKeyboard = 1
; TAB, CAPSLOCK, ENTER, SPACE, LSHIFT, LCTRL, LALT, F1..F12 ou uma letra
KeyboardKey = TAB
UsePad = 1
; L1, L2, R1, R2, UP, DOWN, LEFT, RIGHT, START, SELECT, SQUARE, TRIANGLE, CROSS, CIRCLE, L3, R3
PadButton = LEFT

; A pe, a tela abre pelo botao original do jogo.

[Layout]
; 1 = dentro do veiculo, a linha "Resistencia" vira a habilidade do veiculo atual
;     (carro: conducao, moto: moto, bicicleta: ciclismo, aviao/helicoptero: voo)
SkillRow = 1

[Percent]
; 1 = mostra a porcentagem no canto DIREITO, dentro de cada barra, na janela de estatisticas rapidas
;     (a pe e no veiculo), na tela de estatisticas do menu de pausa e no aviso que aparece
;     no topo da tela quando uma habilidade e aprimorada.
ShowPercent = 1
; Tamanho do texto da porcentagem (1.0 = padrao). Aumente ou diminua se ficar grande/pequeno.
TextScale = 1.0
