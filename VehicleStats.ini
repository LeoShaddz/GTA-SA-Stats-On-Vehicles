[VehicleStats]
; 1 = enabled, 0 = disabled
Enabled = 1

; Trigger to open the stats screen INSIDE the vehicle
UseKeyboard = 1
; TAB, CAPSLOCK, ENTER, SPACE, LSHIFT, LCTRL, LALT, F1..F12, or a letter
KeyboardKey = TAB
UsePad = 1
; L1, L2, R1, R2, UP, DOWN, LEFT, RIGHT, START, SELECT, SQUARE, TRIANGLE, CROSS, CIRCLE, L3, R3
PadButton = LEFT

; On foot, the screen opens using the game's original button.

[Layout]
; 1 = inside the vehicle, the "Stamina" row becomes the current vehicle's skill
;     (car: driving, motorcycle: motorcycle, bicycle: cycling, airplane/helicopter: flying)
SkillRow = 1

[Percent]
; 1 = shows the percentage on the RIGHT side, inside each bar, in the quick stats screen
;     (on foot and in the vehicle), in the pause menu stats screen, and in the notification
;     that appears at the top of the screen when a skill is increased.
ShowPercent = 0
; Percentage text size (1.0 = default). Increase or decrease if it looks too large/small.
TextScale = 1.0